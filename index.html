<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>바디로그</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: 코치용 작업대. 왼쪽 고객 목록, 가운데 어두운 촬영 스테이지(사진 비교), 아래 수치표와 공유 카드. */
:root{
  --bg:#F1F3F2; --surface:#FFFFFF; --surface-2:#F7F8F7; --ink:#13171A; --muted:#66707A; --line:#E0E4E2;
  --accent:#0C8A79; --accent-soft:#E2F2EF; --accent-ink:#FFFFFF;
  --before:#7E8995; --danger:#C8473F; --danger-soft:#FBECEA;
  --stage:#15191C; --stage-2:#1E2327; --stage-line:#2B3136; --stage-ink:#EEF2F1; --stage-muted:#8E989F; --stage-accent:#35C8AF;
  --font-body:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-num:"Sora","IBM Plex Sans KR",-apple-system,"Segoe UI",sans-serif;
  --r-lg:20px; --r-md:12px; --r-sm:8px;
  --shadow:0 1px 2px rgba(19,23,26,.04),0 8px 24px rgba(19,23,26,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1113; --surface:#161A1D; --surface-2:#1B2023; --ink:#ECF0EF; --muted:#98A2A9; --line:#272D31;
  --accent:#33C2AA; --accent-soft:#163430; --accent-ink:#06201C; --before:#8C97A2; --danger:#EC7A72; --danger-soft:#3A1D1B;
  --stage:#0A0C0E; --stage-2:#14181B; --stage-line:#262C30;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1113; --surface:#161A1D; --surface-2:#1B2023; --ink:#ECF0EF; --muted:#98A2A9; --line:#272D31;
  --accent:#33C2AA; --accent-soft:#163430; --accent-ink:#06201C; --before:#8C97A2; --danger:#EC7A72; --danger-soft:#3A1D1B;
  --stage:#0A0C0E; --stage-2:#14181B; --stage-line:#262C30;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar__in{display:flex;align-items:center;gap:12px;height:60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1360px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.topbar .brand>div{min-width:0}.topbar .brand b,.topbar .brand small,.save-state,.coach{white-space:nowrap}.topbar .brand small{overflow:hidden;text-overflow:ellipsis}
.coach #coachName{max-width:6.5em;overflow:hidden;text-overflow:ellipsis}.coach,.save-state{flex:none}
@media (max-width:480px){.topbar .brand small{display:none}.save-state #saveText{display:none}}
.brand__mark{width:30px;height:30px;border-radius:9px;background:var(--ink);display:grid;grid-template-columns:1fr 1fr;align-items:end;gap:3px;padding:7px 7px 7px}
.brand__mark i{display:block;border-radius:2px}
.brand__mark i:first-child{height:15px;background:var(--before)}
.brand__mark i:last-child{height:10px;background:var(--stage-accent)}
.brand b{font-family:var(--font-num);font-weight:700;letter-spacing:.06em;font-size:15px}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.02em;margin-top:-3px}
.save-state{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.save-state .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.save-state.is-dirty .dot{background:#D9A23B}
.coach{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;font-weight:600}
.coach span.av{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:700}

/* layout */
.layout{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:960px){.layout{grid-template-columns:minmax(0,1fr);padding-block:16px 48px}.layout>.rail{display:none}}
@media (min-width:961px){.only-mobile{display:none!important}}

/* client rail */
.rail{position:sticky;top:84px;align-self:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 108px)}
.cno{display:inline-block;margin-right:6px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font:700 11.5px/1.5 var(--font-num);vertical-align:1px}
.rail__head{display:flex;align-items:center;justify-content:space-between}
.rail__head h2{font-size:16px;margin:0}
.rail__head h2 small{color:var(--muted);font-weight:500;margin-left:6px;font-family:var(--font-num)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:0 12px;height:42px;color:var(--muted)}
.search input{border:0;background:none;outline:0;flex:1;min-width:0;color:var(--ink);font-size:14px}
.client-list{display:flex;flex-direction:column;gap:4px;overflow:auto;margin:0 -6px;padding:0 6px}
.client{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--r-md);text-align:left;width:100%}
.client:hover{background:var(--surface-2)}
.client.is-active{background:var(--accent-soft)}
.client .av{width:38px;height:38px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.client.is-active .av{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.client .tx{min-width:0;flex:1}
.client .tx b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client .tx small{display:block;color:var(--muted);font-size:12.5px}
.client .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px;white-space:nowrap}
.empty-note{color:var(--muted);font-size:13.5px;padding:12px 4px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:42px;padding:0 16px;border-radius:var(--r-md);font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn--primary{background:var(--accent);color:var(--accent-ink)}
.btn--primary:hover{filter:brightness(1.05)}
.btn--line{border:1px solid var(--line);background:var(--surface)}
.btn--line:hover{background:var(--surface-2)}
.btn--danger{background:var(--danger-soft);color:var(--danger)}
.btn--sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn--accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* main */
.main{display:flex;flex-direction:column;gap:20px;min-width:0}
.client-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.client-head .av{width:52px;height:52px;border-radius:16px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.client-head .tx{flex:1;min-width:180px}
.client-head h1{margin:0;font-size:24px;line-height:1.25;letter-spacing:-.02em;text-wrap:balance}
.client-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.client-head .actions{display:flex;gap:8px;flex-wrap:wrap}
.period{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12.5px;border-radius:999px;padding:3px 10px;margin-left:8px;vertical-align:3px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.card__head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card__head h2{margin:0;font-size:18px;letter-spacing:-.01em}
.card__head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.label{font-family:var(--font-num);font-size:11px;letter-spacing:.14em;font-weight:600;color:var(--muted);text-transform:uppercase}

/* stage */
.stage{background:var(--stage);color:var(--stage-ink);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.stage__bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stage__bar .grow{flex:1}
.stage__bar--grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stage__bar--grid .chip{justify-content:center;padding:0 8px;white-space:nowrap}
.bgopts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bgopt{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 4px 8px;border-radius:12px;border:1.5px solid var(--stage-line);background:var(--stage-2);color:var(--stage-ink);font-size:12px;font-weight:600}
.bgopt.is-on{border-color:var(--stage-accent);box-shadow:0 0 0 2px rgba(0,0,0,.2) inset}
.bgopt canvas{width:100%;aspect-ratio:3/4;border-radius:8px;display:block}
.chip{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;background:var(--stage-2);border:1px solid var(--stage-line);font-size:13.5px;font-weight:600;color:var(--stage-ink)}
.chip:hover{border-color:#3d454b}
.chip.is-on{background:var(--stage-ink);color:var(--stage);border-color:transparent}
.switch{width:34px;height:20px;border-radius:999px;background:#3a4147;position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.is-on>.switch,.switch.is-on{background:var(--stage-accent)}
.is-on>.switch::after,.switch.is-on::after{transform:translateX(14px)}
.chip .switch{margin-right:-4px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slot{display:flex;flex-direction:column;gap:8px;min-width:0}
.frame{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:14px;overflow:hidden;background:var(--stage-2);outline:1px solid var(--stage-line);touch-action:pan-y}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.frame.is-editing{outline:2px solid var(--stage-accent);touch-action:none;cursor:grab}
.frame.is-editing.mask{cursor:crosshair}
.frame.is-dim{opacity:.55}
.frame__empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--stage-muted);font-size:13px;text-align:center;padding:12px}
.frame__empty .plus{width:52px;height:52px;border-radius:50%;border:1.5px dashed #4a535a;display:grid;place-items:center;color:var(--stage-ink)}
.frame__empty:hover .plus{border-color:var(--stage-accent);color:var(--stage-accent)}
.frame__badge{position:absolute;left:10px;top:10px;font-family:var(--font-num);font-size:11px;font-weight:700;letter-spacing:.14em;padding:5px 9px;border-radius:7px;background:rgba(10,12,14,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;pointer-events:none}
.frame__badge.after{background:var(--stage-accent);color:#06201C}
.frame__hint{position:absolute;left:10px;right:10px;bottom:10px;font-size:12px;padding:6px 10px;border-radius:8px;background:rgba(10,12,14,.66);color:#fff;text-align:center;pointer-events:none}
.slot__meta{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12.5px;color:var(--stage-muted);min-height:28px}
.slot__meta b{color:var(--stage-ink);font-weight:600}
.mini{height:28px;padding:0 10px;white-space:nowrap;flex:none;border-radius:8px;background:var(--stage-2);border:1px solid var(--stage-line);font-size:12px;font-weight:600;color:var(--stage-ink);display:inline-flex;align-items:center;gap:5px}
.tools{background:var(--stage-2);border:1px solid var(--stage-line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.tools__row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tools__row .grow{flex:1}
.tools p{margin:0;font-size:12.5px;color:var(--stage-muted)}
.seg{display:inline-flex;background:var(--stage);border-radius:10px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:700;font-family:var(--font-num);letter-spacing:.08em;color:var(--stage-muted)}
.seg button.is-on{background:var(--stage-ink);color:var(--stage)}
.range{display:flex;align-items:center;gap:10px;flex:1;min-width:200px;font-size:12.5px;color:var(--stage-muted)}
.range input{flex:1;accent-color:var(--stage-accent);min-width:0}
.range output{font-family:var(--font-num);color:var(--stage-ink);min-width:44px;text-align:right}

/* metrics */
.mtable{width:100%;border-collapse:collapse;table-layout:fixed}
.mtable col.c1{width:84px}.mtable col.c4{width:78px}
.mtable th{font-weight:600;text-align:left;font-size:12px;color:var(--muted);padding:0 8px 8px;letter-spacing:.02em}
.mtable td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:middle}
.mtable td:first-child{font-weight:600;font-size:14px;white-space:nowrap;padding-left:0}
.mtable td:first-child small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.field{display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;height:40px;padding:0 10px;gap:4px}
.field:focus-within{border-color:var(--accent);background:var(--surface)}
.field input{border:0;background:none;outline:0;width:100%;min-width:0;font-family:var(--font-num);font-size:15px;font-variant-numeric:tabular-nums}
.field small{color:var(--muted);font-size:12px}
.delta{font-family:var(--font-num);font-weight:700;font-size:16px;white-space:nowrap;text-align:right}
.delta.good{color:var(--accent)}
.delta.bad{color:var(--danger)}
.delta.none{color:var(--muted);font-weight:500}
.mtable th:last-child,.mtable td:last-child{text-align:right;padding-right:0}
.mwrap{overflow-x:auto}
.mtable{min-width:0}
@media (max-width:520px){.mtable col.c1{width:58px}.mtable col.c4{width:56px}.mtable td{padding:6px 3px}.field{padding:0 7px}.field input{font-size:14px}.field input[type=date]{font-size:12px;letter-spacing:-.02em}.field small{display:none}.delta{font-size:14px}.card{padding:16px}}

.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px}
@media (max-width:1180px){.two{grid-template-columns:minmax(0,1fr)}}
.memo{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-md);padding:10px 12px;font-size:14px;line-height:1.55;outline:0}
.memo:focus{border-color:var(--accent);background:var(--surface)}

/* share */
.sexseg label{flex:1;position:relative;cursor:pointer}.sexseg input{position:absolute;opacity:0;pointer-events:none}.sexseg span{display:flex;align-items:center;justify-content:center;height:40px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}.sexseg input:checked+span{background:var(--surface);box-shadow:var(--shadow);color:var(--ink)}
.bc-card{background:linear-gradient(170deg,#12458F,#0A2552);color:#fff;border:0;box-shadow:var(--shadow)}
.bc-card .label{color:#9FB8DE}.bc-card .card__head p{color:#BFD3F2}
.bc-grid{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:18px;align-items:start}
@media (max-width:560px){.bc-grid{grid-template-columns:minmax(0,1fr)}}
.bc-sum{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.bc-row{display:grid;grid-template-columns:52px minmax(0,1fr) 12px minmax(0,1fr) 54px;align-items:center;gap:6px;background:rgba(255,255,255,.07);border-radius:12px;padding:8px 10px}
.bc-row b{font-size:13.5px;white-space:nowrap}.bc-row .arr{color:#7F97BF;text-align:center}
.bc-chip{display:flex;align-items:center;justify-content:space-between;gap:3px;border-radius:9px;padding:5px 7px;font:700 13.5px/1.2 var(--font-num);color:#0B1D33;white-space:nowrap;min-width:0}
.bc-chip small{font:700 10.5px/1 var(--font-body);white-space:nowrap}
.bc-chip.high{color:#fff}.bc-chip.none{background:rgba(255,255,255,.12);color:#9FB8DE;justify-content:center}
.bc-d{text-align:right;font:700 13px var(--font-num);white-space:nowrap}.bc-d.good{color:#9BE22E}.bc-d.bad{color:#FF8A8A}.bc-d.none{color:#7F97BF}
.bc-head{display:grid;grid-template-columns:52px minmax(0,1fr) 12px minmax(0,1fr) 54px;gap:6px;padding:0 10px;font:700 11px var(--font-num);letter-spacing:.1em;color:#9FB8DE}
.bc-head span:nth-child(2),.bc-head span:nth-child(4){text-align:center}.bc-head span:last-child{text-align:right}
.bc-type{display:flex;gap:8px;margin:0 0 14px}.bc-type span{flex:1;text-align:center;background:rgba(0,0,0,.2);border-radius:12px;padding:8px 6px;font-size:12px;color:#BFD3F2}.bc-type b{display:block;font-size:16px;margin-top:2px}
.bc-card .lseg{background:rgba(255,255,255,.08);border-color:transparent}.bc-card .lseg button{color:#BFD3F2}.bc-card .lseg button small{color:#7F97BF}.bc-card .lseg button.is-on{background:#fff;color:#0A2552}.bc-card .lseg button.is-on small{color:#4D6A99}
.bc-btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.bc-card .btn--line{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff}
.bc-card .btn--lime{background:#9BE22E;color:#14250A}.bc-card .btn[disabled]{opacity:.45;pointer-events:none}
.bc-pv{width:100%;border-radius:14px;display:block;box-shadow:0 10px 30px rgba(0,0,0,.35);cursor:zoom-in}
@media (max-width:560px){.bc-pv{max-width:230px;margin:0 auto}}
.bc-empty{background:rgba(255,255,255,.07);border-radius:14px;padding:16px;font-size:13.5px;line-height:1.6;color:#DCE7F7;margin-bottom:12px}.bc-empty b{color:#fff}
.bcform td:first-child{white-space:nowrap}
.form-field .field input{height:auto;border:0;background:none;padding:0;border-radius:0;font-weight:500}
.share{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:18px;align-items:start}
@media (max-width:520px){.share{grid-template-columns:minmax(0,1fr)}.share canvas{max-width:200px;margin:0 auto}}
.share canvas{width:100%;border-radius:12px;display:block;border:1px solid var(--line);background:#111416}
.opt-list{display:flex;flex-direction:column;gap:2px;margin:12px 0 16px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;text-align:left;width:100%}
.opt small{display:block;color:var(--muted);font-size:12px}
.opt .switch{background:var(--line)}
.opt .switch.is-on{background:var(--accent)}
.lseg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.lseg button{flex:1;height:40px;border-radius:9px;font-weight:600;font-size:13.5px;line-height:1.15}

/* ---------- photo loading ---------- */
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src})}
async function ensurePhoto(id){
  if(!id||photos[id])return photos[id];
  if(id==='sample:before'){photos[id]=samplePhoto(false);return photos[id]}
  if(id==='sample:after'){photos[id]=samplePhoto(true);return photos[id]}
  const v=await DB.get('img:'+id); if(!v)return null;
  // photos are stored as raw bytes; older versions stored a Blob, which iPhone in-app browsers often fail to keep
  const blob=v instanceof Blob?v:v.buf?new Blob([v.buf],{type:v.type||'image/jpeg'}):null; if(!blob)return null;
  try{const url=URL.createObjectURL(blob);const im=await loadImg(url);photos[id]={el:im,w:im.naturalWidth,h:im.naturalHeight};return photos[id]}catch(e){return null}
}
async function importFile(file){
  const url=URL.createObjectURL(file);const im=await loadImg(url);
  const k=Math.min(1,1800/Math.max(im.naturalWidth,im.naturalHeight));
  const c=mk(im.naturalWidth*k,im.naturalHeight*k);const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));
  const id=uid();const ok=await DB.set('img:'+id,{type:'image/jpeg',buf:await blob.arrayBuffer()});if(!ok)toast('이 브라우저에서는 사진이 저장되지 않아요. 사파리나 크롬에서 열어주세요');photos[id]={el:c,w:c.width,h:c.height};return id;
}

/* ---------- automatic body alignment (MediaPipe pose landmarks) ---------- */
const MPV='0.10.14',MPCDN=`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MPV}`;
let poseP=null;
function getPose(){
  if(poseP)return poseP;
  poseP=(async()=>{
    const V=await import(`${MPCDN}/vision_bundle.mjs`);
    const rel=p=>new URL(p,location.href).href;
    const tries=[
      [{wasmLoaderPath:rel('mp/vision_wasm_internal.js'),wasmBinaryPath:rel('mp/vision_wasm_internal.wasm')},rel('mp/pose_model.wasm')],
      [{wasmLoaderPath:`${MPCDN}/wasm/vision_wasm_internal.js`,wasmBinaryPath:`${MPCDN}/wasm/vision_wasm_internal.wasm`},'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task']];
    for(const [w,m] of tries){try{return await V.PoseLandmarker.createFromOptions(w,{baseOptions:{modelAssetPath:m,delegate:'CPU'},runningMode:'IMAGE',numPoses:1})}catch(e){console.warn('pose load',e)}}
    throw new Error('pose unavailable');
  })();
  poseP.catch(()=>{poseP=null});
  return poseP;
}
async function detectPose(rec){
  const ph=photos[rec.photo];if(!ph)return null;
  const lm=await getPose();const res=lm.detect(ph.el);const L=res&&res.landmarks&&res.landmarks[0];if(!L)return null;
  const P=i=>[L[i].x*ph.w,L[i].y*ph.h],vis=i=>(L[i].visibility??1)>.5,mid=(a,b)=>[(P(a)[0]+P(b)[0])/2,(P(a)[1]+P(b)[1])/2];
  if(!vis(11)||!vis(12))return null;
  const fpts=[0,2,5,9,10].map(P),fc=[fpts.reduce((s,p)=>s+p[0],0)/5,fpts.reduce((s,p)=>s+p[1],0)/5];
  const earW=Math.hypot(P(7)[0]-P(8)[0],P(7)[1]-P(8)[1]),shW=Math.hypot(P(11)[0]-P(12)[0],P(11)[1]-P(12)[1]);

}
// place points a (shoulders) and b (ankles/hips) of a photo at frame heights ta,tb, body centred on tx. Frame is the fixed 3:4 box.
function solveTf(ph,a,b,ta,tb,tx){
  const W=1,H=4/3,base=Math.max(W/ph.w,H/ph.h);

}
function autoAlign(c){

  if(B.pose&&B.pose[lower]){const tb=lower==='ank'?.94*H:.29*H+.3*H;B.tf=solveTf(photos[B.photo],B.pose.sh,B.pose[lower],.29*H,tb,.5);done++}
  if(A.pose&&A.pose[lower]){
    if(B.pose&&B.pose[lower]){const phB=photos[B.photo],L=layoutOf(B,phB,1,H);const fy=p=>L.dy+p[1]*L.sc,fx=p=>L.dx+p[0]*L.sc;
      A.tf=solveTf(photos[A.photo],A.pose.sh,A.pose[lower],fy(B.pose.sh),fy(B.pose[lower]),(fx(B.pose.sh)+fx(B.pose[lower]))/2)}
    else{const tb=lower==='ank'?.94*H:.59*H;A.tf=solveTf(photos[A.photo],A.pose.sh,A.pose[lower],.29*H,tb,.5)}
    done++}

}
// rough face-only cover from the face landmarks; hair above the forehead stays visible
function autoMask(rec){
  const f=rec.pose&&rec.pose.face;if(!f)return;const r=f.r,st=[];let row=0;
  for(let y=-.72*r;y<=.8*r;y+=r*.26,row++){const xs=[];for(let x=-.62*r;x<=.62*r;x+=r*.22)xs.push(x);if(row%2)xs.reverse();xs.forEach(x=>st.push([f.cx+x,f.cy+y,r*.46]))}

async function runAuto(c,{quiet=false}={}){
  const need=['before','after'].filter(k=>c[k].photo&&!c[k].pose&&!c[k].poseTried);
  if(need.length){
    if(!quiet)toast('몸 위치를 인식하는 중…');
    try{for(const k of need){c[k].poseTried=true;const p=await detectPose(c[k]);if(p){c[k].pose=p;if(!c[k].mask.length)autoMask(c[k])}}}
    catch(e){toast('자동 인식을 불러오지 못했습니다. 인터넷 연결을 확인하거나 직접 맞춰주세요');return 0}
  }
  const n=autoAlign(c);touch(c);await persist();renderMain();
  const missing=['before','after'].filter(k=>c[k].photo&&!c[k].pose);
  if(missing.length)toast(`${missing.map(k=>k.toUpperCase()).join('·')} 사진에서 몸을 찾지 못했습니다. 전신 사진인지 확인하거나 직접 맞춰주세요`);
  else if(n&&!quiet)toast('두 사진의 몸 위치와 크기를 자동으로 맞췄습니다');
  return n;
}

const erases={};

function eraseFor(id,rec){

/* ---------- auto text finder: looks for bright overlay text (time-stamp app dates, logos) and returns erase strokes ---------- */
function findTextStrokes(rec){
  const ph=rec.photo&&photos[rec.photo];if(!ph)return [];
  const k=Math.min(1,700/Math.max(ph.w,ph.h)),w=Math.round(ph.w*k),h=Math.round(ph.h*k);
  const cv=mk(w,h),cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(ph.el,0,0,w,h);
  const d=cx.getImageData(0,0,w,h).data,Y=new Float32Array(w*h);
  for(let i=0;i<w*h;i++)Y[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];
  freeCanvas(cv);
  // text pixel = bright stroke with a dark edge/shadow right next to it
  const T=new Uint8Array(w*h),R=2;
  for(let y=R;y<h-R;y++)for(let x=R;x<w-R;x++){const v=Y[y*w+x];if(v<180)continue;let mn=255;
    for(let j=-R;j<=R;j++)for(let i=-R;i<=R;i++){const u=Y[(y+j)*w+x+i];if(u<mn)mn=u}
    if(v-mn>=75)T[y*w+x]=1}
  // join letters of one line (gaps along rows, small gaps between rows)
  const M=new Uint8Array(T),gap=Math.max(4,Math.round(w*.014));
  for(let y=0;y<h;y++){let last=-1;for(let x=0;x<w;x++)if(T[y*w+x]){if(last>=0&&x-last<=gap)for(let q=last+1;q<x;q++)M[y*w+q]=1;last=x}}
  for(let x=0;x<w;x++){let last=-1;for(let y=0;y<h;y++)if(M[y*w+x]){if(last>=0&&y-last<=3)for(let q=last+1;q<y;q++)M[q*w+x]=1;last=y}}
  // body area (when the pose is known) is left alone
  const P=rec.pose,f=P&&P.face;let bx0=-1,bx1=-1,by0=0,by1=0;
  if(f){const cxp=P.sh?P.sh[0]:f.cx,hw=f.r*3.4;bx0=(cxp-hw)*k;bx1=(cxp+hw)*k;by0=(f.cy-f.r*1.3)*k;by1=(P.ank?P.ank[1]+f.r:ph.h)*k}
  const lab=new Int32Array(w*h),out=[];let n=0;const stack=[];
  for(let s0=0;s0<w*h;s0++){if(!M[s0]||lab[s0])continue;n++;lab[s0]=n;stack.push(s0);let x0=w,x1=0,y0=h,y1=0,cnt=0,area=0;
    while(stack.length){const q=stack.pop(),x=q%w,y=(q-x)/w;area++;if(T[q])cnt++;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
      if(x>0&&M[q-1]&&!lab[q-1]){lab[q-1]=n;stack.push(q-1)}if(x<w-1&&M[q+1]&&!lab[q+1]){lab[q+1]=n;stack.push(q+1)}
      if(y>0&&M[q-w]&&!lab[q-w]){lab[q-w]=n;stack.push(q-w)}if(y<h-1&&M[q+w]&&!lab[q+w]){lab[q+w]=n;stack.push(q+w)}}
    const bw=x1-x0+1,bh=y1-y0+1;
    if(bh<5||bh>h*.12||bw<bh*1.2||bw>w*.95||cnt<20)continue;
    const dens=cnt/(bw*bh);if(dens<.06||dens>.6)continue;
    // letters cross a row many times; plain edges (door frames, blinds) do not
    let tr=0,rows=0;for(let y=y0+Math.floor(bh*.25);y<=y0+Math.ceil(bh*.75);y++){rows++;for(let x=x0+1;x<=x1;x++)if(T[y*w+x]!==T[y*w+x-1])tr++}
    if(tr/Math.max(1,rows)<Math.max(4,bw/bh*1.2))continue;
    const mx=(x0+x1)/2,my=(y0+y1)/2;if(mx>bx0&&mx<bx1&&my>by0&&my<by1)continue;
    out.push([x0,y0,x1,y1]);
  }
  // one erase stroke per text line, in photo pixels
  return out.map(([x0,y0,x1,y1])=>{const r=Math.max(4,(y1-y0+1)*.8)/k,yc=(y0+y1)/2/k,a=x0/k,b=x1/k,st=[];
    for(let x=a;;x+=r*.6){st.push([Math.min(x,b),yc,r]);if(x>=b)break}return st});
}

async function loadPersonMask(id){

  const k=Math.min(1,1024/Math.max(ph.w,ph.h)),w=Math.round(ph.w*k),h=Math.round(ph.h*k);
  const src=mk(w,h);src.getContext('2d').drawImage(ph.el,0,0,w,h);
  const acc=new Float32Array(w*h),wt=new Float32Array(w*h);let got=false;
  const run=(sx,sy,sw,sh,weight)=>{const t=mk(sw,sh);t.getContext('2d').drawImage(src,sx,sy,sw,sh,0,0,sw,sh);
    lm.segment(t,res=>{const m=res.confidenceMasks&&res.confidenceMasks[0];if(!m)return;const f=m.getAsFloat32Array(),mw=m.width,mh=m.height;got=true;
      for(let y=0;y<sh;y++){const fy=Math.min(mh-1,Math.floor(y*mh/sh)),wy=weight*(sh>sw*1.05?1:Math.max(.05,1-Math.abs(y/sh-.5)*1.6));
        for(let x=0;x<sw;x++){const v=f[fy*mw+Math.min(mw-1,Math.floor(x*mw/sw))],i=(y+sy)*w+x+sx;acc[i]+=v*wy;wt[i]+=wy}}});
    freeCanvas(t)};
  run(0,0,w,h,.35);

  if(h>S*1.15){const n=Math.ceil((h-S)/(S*.5))+1;for(let i=0;i<n;i++)run(0,Math.round((h-S)*i/(n-1)),S,S,1)}

}

function homeArt(){

    const fade=(c0)=>{const g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,c0+'f2');g.addColorStop(.42,c0+'b0');g.addColorStop(.62,c0+'00');x.fillStyle=g;x.fillRect(0,0,W,H)};
    if(cv.dataset.homeart==='ba'){
      const g=x.createRadialGradient(W*.72,H*.45,10,W*.72,H*.45,Math.max(W,H)*.75);g.addColorStop(0,'#24524a');g.addColorStop(1,'#111416');x.fillStyle=g;x.fillRect(0,0,W,H);

          const fx=fx0+i*(fw+gap);x.save();x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=24*k;x.fillStyle='#222';rr(x,fx,fy,fw,fh,16*k);x.fill();x.restore();
          x.save();rr(x,fx,fy,fw,fh,16*k);x.clip();x.translate(fx,fy);drawRec(x,sm[s],fw,fh,true);x.restore();
          x.font=`700 ${11*k}px Sora, sans-serif`;const tw=x.measureText(L).width+16*k;

        });

/* ---------- pointer interaction on fixed frames ---------- */
function bindFrames(){
  document.querySelectorAll('[data-frame]').forEach(fr=>{
    const k=fr.dataset.frame;const pts=new Map();let start=null,stroke=null;
    const pos=e=>{const r=fr.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,W:r.width,H:r.height}};
    fr.addEventListener('pointerdown',e=>{
      if(!mode)return;const c=active();if(!c||!c[k].photo)return;
      if(mode.side!==k){mode.side=k;renderMain();return}
      e.preventDefault();fr.setPointerCapture(e.pointerId);const p=pos(e);pts.set(e.pointerId,p);
      if(mode.kind==='adjust'){start={tf:{...c[k].tf},pts:new Map([...pts].map(([i,v])=>[i,{...v}]))}}
      else{stroke=[];strokesOf(c[k]).push(stroke);addStamp(c[k],stroke,p);drawFrame(k)}
    });
    fr.addEventListener('pointermove',e=>{
      if(!mode||!pts.has(e.pointerId))return;const c=active();const p=pos(e);pts.set(e.pointerId,p);const r=c[k];
      if(mode.kind==='adjust'&&start){
        const now=[...pts.values()],was=[...start.pts.values()];
        if(now.length>=2&&was.length>=2){
          const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);const f=dist(now[0],now[1])/Math.max(1,dist(was[0],was[1]));
          r.tf.s=clamp(start.tf.s*f,.4,3);
          const mx=(now[0].x+now[1].x)/2-(was[0].x+was[1].x)/2,my=(now[0].y+now[1].y)/2-(was[0].y+was[1].y)/2;
          r.tf.x=start.tf.x+mx/p.W;r.tf.y=start.tf.y+my/p.H;
        }else{const a=was[0],b=now[0];r.tf.x=start.tf.x+(b.x-a.x)/p.W;r.tf.y=start.tf.y+(b.y-a.y)/p.H}
        syncZoom(r);drawFrame(k);
      }else if((mode.kind==='mask'||mode.kind==='text')&&stroke){addStamp(r,stroke,p);drawFrame(k)}
    });
    const end=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
      if(mode&&mode.kind==='adjust'){const c=active();start=pts.size?{tf:{...c[k].tf},pts:new Map([...pts].map(([i,v])=>[i,{...v}]))}:null;if(!pts.size){touch(c);drawPreviewSoon()}}
      else if(stroke&&!pts.size){stroke=null;touch(active());renderToolsOnly();drawPreviewSoon()}};
    fr.addEventListener('pointerup',end);fr.addEventListener('pointercancel',end);
    fr.addEventListener('wheel',e=>{if(!mode||mode.kind!=='adjust'||mode.side!==k)return;e.preventDefault();const r=active()[k];r.tf.s=clamp(r.tf.s*Math.exp(-e.deltaY*.0015),.4,3);syncZoom(r);drawFrame(k);touch(active());drawPreviewSoon()},{passive:false});
  });
}
function addStamp(rec,stroke,p){
  const L=lastL[mode.side];if(!L)return;const ix=(p.x-L.dx)/L.sc,iy=(p.y-L.dy)/L.sc,r=brush*p.W/L.sc;
  const last=stroke[stroke.length-1];
  if(last){const dx=ix-last[0],dy=iy-last[1],d=Math.hypot(dx,dy),step=r*.35;if(d<step)return;const n=Math.floor(d/step);for(let i=1;i<=n;i++)stroke.push([last[0]+dx*i/n,last[1]+dy*i/n,r])}
  else stroke.push([ix,iy,r]);
}
function syncZoom(r){const z=$('#zoom');if(z){z.value=Math.round(r.tf.s*100);$('#zoomOut').textContent=Math.round(r.tf.s*100)+'%'}}
function renderToolsOnly(){const c=active();const t=document.querySelector('.stage .tools');if(t){const tmp=document.createElement('div');tmp.innerHTML=toolsHTML(c);t.replaceWith(tmp.firstElementChild)}}

const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
async function exportBackup(){
  toast('백업 파일을 만드는 중이에요…');await persist();
  const images={},thumbsOut={};
  for(const c of S.clients){for(const k of ['before','after']){const id=c[k].photo;if(!id||id.startsWith('sample:')||images[id])continue;
      const v=await DB.get('img:'+id);const bl=v instanceof Blob?v:v&&v.buf?new Blob([v.buf],{type:v.type||'image/jpeg'}):null;if(bl)images[id]=await blobToDataURL(bl)}
    for(const h of c.history||[]){const t=thumbs[h.id]||await DB.get('thumb:'+h.id);if(t)thumbsOut[h.id]=t}}
  const data=JSON.stringify({app:'bodylog',v:1,exportedAt:new Date().toISOString(),coach:S.coach,clients:S.clients,images,thumbs:thumbsOut});
  const d=new Date(),fname=`bodylog_backup_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  const blob=new Blob([data],{type:'application/json'});const file=new File([blob],fname,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e&&e.name==='AbortError')return}
  const dls=await getDownloads();
  if(dls){try{await dls.save({filename:fname,data:blob});toast(`고객 ${S.clients.length}명 백업 파일을 저장했어요`)}catch(e){if(!e||e.code!=='declined')toast('여기서는 파일 저장이 막혀 있어요. 사파리에서 claude.ai에 로그인하고 열어주세요')}return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove();
}
// 사라진 사진 되찾기: photos/records still in this phone's storage that no client points to any more
// (e.g. after the client list was overwritten) come back as '되찾은 고객' — two photos each, oldest first —
// and the saved share images come back as records of one '되찾은 저장 기록' client.
async function rescueLost(){
  toast('휴대폰에 남은 사진을 찾는 중이에요…');
  const keys=await DB.keys(),usedImg=new Set(),usedSnap=new Set();
  for(const k of keys){if(typeof k!=='string'||!(k==='state'||k.startsWith('state:')))continue;let st;try{st=JSON.parse(await DB.get(k))}catch(e){continue}
    for(const c of (st&&st.clients)||[]){for(const r of [c.before,c.after])if(r&&r.photo)usedImg.add(r.photo);for(const h of c.history||[])usedSnap.add(h.id)}}
  for(const c of S.clients){for(const r of [c.before,c.after])if(r&&r.photo)usedImg.add(r.photo);for(const h of c.history||[])usedSnap.add(h.id)}
  const t36=id=>parseInt(String(id).slice(0,8),36)||0;
  const imgs=keys.filter(k=>typeof k==='string'&&k.startsWith('img:')).map(k=>k.slice(4)).filter(id=>!usedImg.has(id)).sort((a,b)=>t36(a)-t36(b));
  const snaps=keys.filter(k=>typeof k==='string'&&k.startsWith('thumb:')).map(k=>k.slice(6)).filter(id=>!usedSnap.has(id)).sort((a,b)=>t36(b)-t36(a));
  if(!imgs.length&&!snaps.length){closeModal();toast('되찾을 사진이 없어요');return}
  const now=Date.now();let n=0;
  for(let i=0;i<imgs.length;i+=2){n++;const c={id:uid(),name:`되찾은 고객 ${n}`,age:'',sex:'f',height:'',phone:'',consent:0,memo:'사라진 사진 되찾기로 복구했어요. 이름과 정보를 다시 넣어주세요.',history:[],createdAt:now,updatedAt:now,before:blankRec(),after:blankRec()};
    c.before.photo=imgs[i];if(imgs[i+1])c.after.photo=imgs[i+1];S.clients.push(c)}
  if(snaps.length){const c={id:uid(),name:'되찾은 저장 기록',age:'',sex:'f',height:'',phone:'',consent:0,memo:'예전에 저장한 공유 이미지들이에요. 눌러서 보고 저장할 수 있어요.',history:[],createdAt:now,updatedAt:now,before:blankRec(),after:blankRec()};
    for(const id of snaps){const t=await DB.get('thumb:'+id);if(!t)continue;thumbs[id]=t;c.history.push({id,savedAt:t36(id)||now,period:'',before:{},after:{}})}
    if(c.history.length)S.clients.push(c)}
  await persist();closeModal();renderAll();toast(`사진 ${imgs.length}장${snaps.length?`, 저장 기록 ${snaps.length}개`:''}를 되찾았어요. 고객 목록을 확인해 주세요`);
}
async function importBackup(file){
  let b;try{b=JSON.parse(await file.text())}catch(e){toast('백업 파일을 읽지 못했어요');return}
  if(!b||b.app!=='bodylog'||!Array.isArray(b.clients)){toast('바디로그 백업 파일이 아니에요');return}
  for(const [id,url] of Object.entries(b.images||{})){try{const bl=await (await fetch(url)).blob();await DB.set('img:'+id,{type:bl.type||'image/jpeg',buf:await bl.arrayBuffer()});delete photos[id]}catch(e){}}
  for(const [id,t] of Object.entries(b.thumbs||{})){thumbs[id]=t;await DB.set('thumb:'+id,t)}
  let added=0,updated=0;
  for(const c of b.clients){const i=S.clients.findIndex(x=>x.id===c.id);if(i>=0){S.clients[i]=c;updated++}else{S.clients.push(c);added++}}
  {const c=active();if(c)await Promise.all([ensurePhoto(c.before.photo),ensurePhoto(c.after.photo)])}
  await persist();closeModal();renderAll();toast(`백업을 불러왔어요 (새 고객 ${added}명, 덮어쓴 고객 ${updated}명)`);
}

async function pinHash(pin,salt){
  const data=new TextEncoder().encode(salt+':'+pin);
  try{const h=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=2166136261;for(const b of data){h^=b;h=Math.imul(h,16777619)>>>0}return 'f'+h.toString(16)}
}
const sess={get(){try{return localStorage.getItem('bodylog.session')}catch(e){return null}},set(v){try{v?localStorage.setItem('bodylog.session',v):localStorage.removeItem('bodylog.session')}catch(e){}v?DB.set('session',v):DB.del('session')}}; // kept in both places so in-app browsers that clear one still stay logged in
let authMode='login',fails=0,lockUntil=0;
const TERMS=`<p><b>1. 저장하는 정보</b><br>코치 이메일, 고객 이름·전화번호, 비포·애프터 사진, 체중·체지방률·골격근량 등 인바디 기록, 메모.</p>
<p><b>2. 저장 위치</b><br>지금은 이 휴대폰(브라우저) 안에만 저장되고, 회사 서버로 보내지지 않아요.</p>
<p><b>3. 고객 동의</b><br>사진과 인바디 기록은 건강 관련 정보예요. 코치는 기록하기 전에 고객 본인의 동의를 받아야 하고, 공유할 때는 얼굴 가림을 쓰고 동의한 범위에서만 써주세요.</p>
<p><b>4. 보관과 삭제</b><br>회원 탈퇴를 하면 계정과 고객 기록·사진이 모두 바로 지워지고 되돌릴 수 없어요.</p>
<p><b>5. 이용 제한</b><br>만 14세 미만은 가입할 수 없어요. 다른 사람의 사진을 동의 없이 올리거나 퍼뜨리면 안 돼요.</p>
<p><b>6. 운영자</b><br>피다다이어트(PA다이어트) · 대표 한효정 · 사업자등록번호 517-14-01969<br>충청남도 서산시 예천4로 48-12</p>`;
function renderAuth(msg=''){
  const su=authMode==='signup',rs=authMode==='reset';
  $('#auth').innerHTML=`<div class="auth__card">
    <div class="brand"><span class="brand__mark" aria-hidden="true"><i></i><i></i></span><div><b>BODYLOG</b><small>코치 전용 비포·애프터 기록</small></div></div>
    <div class="lseg" role="tablist"><button type="button" data-auth="login" class="${su?'':'is-on'}">로그인</button><button type="button" data-auth="signup" class="${su?'is-on':''}">회원가입</button></div>
    <form id="authForm" style="display:flex;flex-direction:column;gap:12px" novalidate>
      <label class="form-field">이메일 (아이디)<input id="a-email" type="email" inputmode="email" autocomplete="username" placeholder="coach@example.com"></label>
      ${rs?'<p class="auth__note" style="text-align:left">가입한 이메일과 새 비밀번호를 넣으면 비밀번호가 바뀌어요. 고객 기록은 그대로 남아요.</p>':''}
      <label class="form-field">${rs?'새 비밀번호':'비밀번호'} (숫자 6자리)<input id="a-pin" type="password" inputmode="numeric" maxlength="6" autocomplete="${su||rs?'new-password':'current-password'}" placeholder="••••••"></label>
      ${rs?`<label class="form-field">새 비밀번호 확인<input id="a-pin2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password" placeholder="••••••"></label>`:''}
      ${su?`<label class="form-field">비밀번호 확인<input id="a-pin2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password" placeholder="••••••"></label>
      <label class="form-field">코치 이름<input id="a-name" maxlength="20" placeholder="예: 한코치"></label>
      <label class="agree"><input id="a-agree" type="checkbox"><span><b>[필수]</b> 이용약관과 개인정보 처리에 동의해요</span></label>
      <details class="terms"><summary>내용 보기</summary>${TERMS}</details>`:''}
      <p id="a-err" class="auth__err" ${msg?'':'hidden'}>${esc(msg)}</p>
      <button type="submit" class="btn btn--primary" style="width:100%;height:48px">${rs?'비밀번호 바꾸고 로그인':su?'가입하고 시작하기':'로그인'}</button>
      ${su?'':`<button type="button" class="auth__demo" style="font-weight:500;color:var(--muted);text-decoration:underline" data-auth="${rs?'login':'reset'}">${rs?'로그인으로 돌아가기':'비밀번호를 잊으셨나요?'}</button>`}
    </form>
    ${/KAKAOTALK|NAVER\(|Instagram|FBAN|FBAV|Line\//i.test(navigator.userAgent)?`<p class="auth__err" style="background:var(--danger-soft);border-radius:12px;padding:10px 12px;line-height:1.55"><b>카톡 안에서 열면 창을 닫을 때 계정과 고객 기록이 지워질 수 있어요.</b><br>아래 오른쪽 공유 버튼(↑)을 눌러 <b>'Safari로 열기'</b>(갤럭시는 '다른 브라우저로 열기')를 눌러 사용해주세요.</p>`:''}
    <button type="button" class="auth__demo" data-auth="demo">가입 없이 둘러보기</button>
    <p class="auth__note">지금은 이 휴대폰(브라우저)에만 계정과 고객 기록이 저장돼요. 고객 사진은 외부로 전송되지 않습니다.</p>
  </div>`;
  $('#auth').hidden=false;document.body.classList.add('locked');
  $('#a-email').value=$('#a-email').value||'';
  document.querySelectorAll('#auth [inputmode=numeric]').forEach(i=>i.addEventListener('input',()=>{i.value=i.value.replace(/\D/g,'').slice(0,6)}));
  $('#authForm').addEventListener('submit',onAuth);
}
async function onAuth(e){
  e.preventDefault();const err=m=>{const p=$('#a-err');p.textContent=m;p.hidden=false};
  const email=$('#a-email').value.trim().toLowerCase(),pin=$('#a-pin').value;
  if(!emailOk(email))return err('이메일 주소를 정확히 입력해주세요.');
  if(!/^\d{6}$/.test(pin))return err('비밀번호는 숫자 6자리로 입력해주세요.');
  const accounts=(await DB.get('accounts'))||[];
  const weak=/^(\d)\1{5}$/.test(pin)||'0123456789'.includes(pin)||'9876543210'.includes(pin);
  const noAcc='이 휴대폰(브라우저)에는 이 이메일로 가입된 계정이 없어요. 카카오톡 안에서 연 것과 사파리에서 연 것은 따로 저장되니, 가입했던 곳에서 열어주세요.';
  if(authMode==='reset'){
    const a=accounts.find(x=>x.email===email);if(!a)return err(noAcc);
    if(pin!==$('#a-pin2').value)return err('새 비밀번호 확인이 일치하지 않습니다.');
    if(weak)return err('111111, 123456 같은 쉬운 번호는 쓸 수 없어요.');
    a.salt=uid()+uid();a.hash=await pinHash(pin,a.salt);await DB.set('accounts',accounts);
    fails=0;lockUntil=0;authMode='login';sess.set(a.id);await openAccount({id:a.id,email:a.email});toast('비밀번호를 바꿨어요');return;
  }
  if(authMode==='signup'){
    if(pin!==$('#a-pin2').value)return err('비밀번호 확인이 일치하지 않습니다.');
    if(weak)return err('111111, 123456 같은 쉬운 번호는 쓸 수 없어요.');
    if(!$('#a-agree').checked)return err('이용약관과 개인정보 처리에 동의해주세요.');
    if(accounts.some(a=>a.email===email))return err('이미 가입된 이메일입니다. 로그인해주세요.');
    const salt=uid()+uid(),acc={id:'c'+uid(),email,salt,hash:await pinHash(pin,salt),createdAt:Date.now(),agreedAt:Date.now()};
    accounts.push(acc);await DB.set('accounts',accounts);
    // first account on this device keeps the records made before sign-up existed
    const legacy=await DB.get('state');if(legacy&&accounts.length===1){await DB.set('state:'+acc.id,legacy);await DB.del('state')}
    sess.set(acc.id);await openAccount({id:acc.id,email},{coachName:$('#a-name').value.trim()});toast('가입을 환영합니다');return;
  }
  if(Date.now()<lockUntil)return err(`잠시 후 다시 시도해주세요 (${Math.ceil((lockUntil-Date.now())/1000)}초).`);
  const acc=accounts.find(a=>a.email===email);
  if(!acc)return err(noAcc);
  if(acc.hash!==await pinHash(pin,acc.salt)){fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}return err('이메일 또는 비밀번호가 맞지 않습니다.')}
  fails=0;sess.set(acc.id);await openAccount({id:acc.id,email:acc.email});
}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-auth]');if(!b)return;
  if(b.dataset.auth==='demo'){sess.set('demo');await openAccount({id:'demo',email:'',demo:true},{coachName:'코치'});toast('둘러보기 모드예요. 기록은 이 기기에만 남아요');return}
  authMode=b.dataset.auth;renderAuth()});
async function logout(){await persist();sess.set(null);ACC=null;closeModal();renderAuth()}

(()=>{const sp=$('#splash');if(!sp)return;let done=false;const out=()=>{if(done)return;done=true;sp.classList.add('is-out');setTimeout(()=>sp.remove(),500)};
  sp.addEventListener('click',out);setTimeout(out,1800)})();
(async()=>{
  await DB.open();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  const sid=sess.get()||await DB.get('session');
  if(sid==='demo')return openAccount({id:'demo',email:'',demo:true},{coachName:'코치'});
  const accounts=(await DB.get('accounts'))||[];const acc=sid&&accounts.find(a=>a.id===sid);
  if(acc)return openAccount({id:acc.id,email:acc.email});
  authMode=accounts.length?'login':'signup';renderAuth();
})();
})();
</script>
