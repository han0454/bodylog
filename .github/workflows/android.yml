name: 안드로이드 앱 빌드

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - mp/**
      - app/**
      - .github/workflows/android.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 웹 앱 파일 넣기
        run: |
          rm -rf www && mkdir -p www/mp
          cp ../index.html www/index.html
          cp ../mp/* www/mp/
      - run: npm ci
      - run: npx cap sync android
      - name: 설치 파일(AAB, APK) 만들기
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bodylog-android
          path: |
            app/android/app/build/outputs/bundle/release/*.aab
            app/android/app/build/outputs/apk/debug/*.apk
      - name: 만든 파일을 android-builds 브랜치에 보관
        working-directory: .
        run: |
          mkdir -p /tmp/out
          cp app/android/app/build/outputs/bundle/release/*.aab /tmp/out/bodylog-unsigned.aab
          cp app/android/app/build/outputs/apk/debug/*.apk /tmp/out/bodylog-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan android-builds
          git rm -rfq .
          cp /tmp/out/* .
          echo "${GITHUB_SHA}" > source-commit.txt
          git add bodylog-unsigned.aab bodylog-debug.apk source-commit.txt
          git commit -qm "빌드 ${GITHUB_SHA::7}"
          git push -f origin android-builds
