name: 안드로이드 앱 빌드

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - mp/**
      - app/**
      - .github/workflows/android.yml

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 웹 앱 파일 넣기
        run: |
          rm -rf www && mkdir -p www/mp
          cp ../index.html www/index.html
          cp ../mp/* www/mp/
      - run: npm ci
      - run: npx cap sync android
      - name: 설치 파일(AAB, APK) 만들기
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bodylog-android
          path: |
            app/android/app/build/outputs/bundle/release/*.aab
            app/android/app/build/outputs/apk/debug/*.apk
